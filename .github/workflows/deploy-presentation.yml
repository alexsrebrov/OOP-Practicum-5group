name: Deploy Presentations

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build presentation
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # Prepare presentation directory
      # --------------------------------------------------
      - name: Prepare site
        run: |
          mkdir -p _site

          cp presentation/index.html _site/index.html
          cp presentation/app.js _site/app.js
          cp presentation/style.css _site/style.css

      # --------------------------------------------------
      # Find every README.md and copy it to the site
      # --------------------------------------------------
      - name: Copy README files
        run: |
          find . \
            -type f \
            -name "README.md" \
            -not -path "./.git/*" \
            -not -path "./.github/*" \
            -not -path "./presentation/*" \
            -not -path "./_site/*" \
            -print0 |
          while IFS= read -r -d '' file; do

            directory=$(dirname "$file")

            # Remove ./ from the beginning
            directory=${directory#./}

            echo "Copying: $file"

            mkdir -p "_site/$directory"

            cp "$file" "_site/$directory/README.md"

          done

      # --------------------------------------------------
      # Generate weeks.json
      # --------------------------------------------------
      - name: Generate weeks.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          excluded = {
              ".git",
              ".github",
              "presentation",
              "_site"
          }

          entries = []

          for root, dirs, files in os.walk("."):

              # Do not scan excluded directories
              dirs[:] = [
                  d for d in dirs
                  if d not in excluded
                  and not d.startswith(".")
              ]

              # We only care about directories
              # containing README.md
              if "README.md" not in files:
                  continue

              directory = root.removeprefix("./")

              # Ignore root README.md
              if not directory:
                  continue

              # Display name
              name = directory

              # Format Week01 -> Week 01
              match = re.fullmatch(
                  r"Week(\d+)",
                  directory
              )

              if match:
                  name = f"Week {int(match.group(1)):02d}"

              entries.append({
                  "name": name,
                  "path": f"{directory}/README.md"
              })

          # Sort alphabetically
          entries.sort(
              key=lambda entry: entry["name"].lower()
          )

          os.makedirs("_site", exist_ok=True)

          with open(
              "_site/weeks.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  entries,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("Generated weeks.json:")
          print(
              json.dumps(
                  entries,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

      # --------------------------------------------------
      # Verify generated site
      # --------------------------------------------------
      - name: Verify site
        run: |
          echo "======================================"
          echo "Generated site:"
          echo "======================================"

          find _site -type f | sort

          echo ""
          echo "======================================"
          echo "weeks.json:"
          echo "======================================"

          cat _site/weeks.json

      # --------------------------------------------------
      # Configure GitHub Pages
      # --------------------------------------------------
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # --------------------------------------------------
      # Upload site
      # --------------------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  # ======================================================
  # DEPLOY
  # ======================================================

  deploy:
    name: Deploy presentation
    runs-on: ubuntu-latest

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
